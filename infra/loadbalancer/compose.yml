services:
  nginx:
    image: nginx:1.28-alpine
    container_name: gold-rush-lb
    restart: unless-stopped

    # app VM 증설과 장기 SSE 연결로 인한 파일 디스크립터 부족 방지
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    ports:
      - "80:80"

    volumes:
      - ./nginx/${NGINX_CONFIG:-nginx.local.conf}:/etc/nginx/nginx.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - lb-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/stub_status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: gold-rush-nginx-exporter
    restart: unless-stopped

    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"

    ports:
      - "9113:9113"

    depends_on:
      nginx:
        condition: service_healthy

    networks:
      - lb-network

networks:
  lb-network:
    driver: bridge
