services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: gold-rush-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      # 단일 Kafka 노드를 KRaft의 Broker 겸 Controller로 실행
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Compose 내부 통신과 외부 클라이언트 통신을 서로 다른 Listener로 분리
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${MESSAGING_HOST:-192.168.0.43}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 단일 Controller Quorum 구성
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # 단일 Broker 환경에 맞춘 내부 Topic 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 실험용 Topic은 topic-init 서비스에서 명시적으로 생성
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 2

      # 반복 부하 테스트로 쌓이는 데이터와 JVM 메모리를 제한
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1024m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    mem_limit: 3g
    cpus: 1.5
    networks:
      - goldrush-db-network

  # Kafka가 준비되면 실험에 필요한 Topic을 한 번 생성하고 종료
  topic-init:
    image: apache/kafka:4.3.1
    container_name: gold-rush-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mining-requested \
          --partitions 2 \
          --replication-factor 1 \
          --config retention.ms=86400000

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mining-completed \
          --partitions 2 \
          --replication-factor 1 \
          --config retention.ms=86400000

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic mining-requested-dlq \
          --partitions 2 \
          --replication-factor 1 \
          --config retention.ms=604800000

        echo 'Kafka topics created.'
    networks:
      - goldrush-db-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: gold-rush-kafka-exporter
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"
    networks:
      - goldrush-db-network
      - goldrush-monitoring

volumes:
  kafka-data:
    name: gold-rush-kafka-data

networks:
  goldrush-db-network:
    name: goldrush-db-network
  goldrush-monitoring:
    name: goldrush-monitoring
