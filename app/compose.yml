services:
  gold-rush-app:
    image: ghcr.io/yeoooo/gold-rush-lab:${APP_IMAGE_TAG:-v0.5}
    restart: unless-stopped
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      POSTGRES_DB: ${POSTGRES_DB:-goldrush}
      POSTGRES_USER: ${POSTGRES_USER:-goldrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_CONNECTION_POOL_SIZE: ${DB_CONNECTION_POOL_SIZE:-50}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SSE_HEARTBEAT_INTERVAL_MILLIS: ${SSE_HEARTBEAT_INTERVAL_MILLIS:-15000}
    ports:
      - "${APP_PORT:-8080}:8080"
