services:
  gold-rush-consumer:
    image: ghcr.io/yeoooo/gold-rush-lab-consumer:${CONSUMER_IMAGE_TAG:-v0.1}
    restart: unless-stopped
    ports:
      - "${CONSUMER_PORT:-8080}:8080"
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      POSTGRES_USER: ${POSTGRES_USER:-goldrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_CONNECTION_POOL_SIZE: ${CONSUMER_DB_CONNECTION_POOL_SIZE:-20}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
